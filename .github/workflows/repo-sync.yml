# Scheduled sync of the default recipe repo. Daily: snapshot Void, translate
# the default.set, build what the diff changed, and push to the bot-only
# repo. A failed build blocks the push and opens an issue here; a
# refusal holds just that package, files an issue, and the rest of
# the day still commits. The logic lives in ci/*.sh so
# it is testable offline (tests/810-815); this file only wires it up.
#
# One-time setup by hand: on alperien/chy-recipes,
# add a write deploy key, store its private key as the RECIPES_DEPLOY_KEY
# secret here, and lock its default branch to that key.
name: repo-sync

on:
  schedule:
    - cron: '17 3 * * *'          # daily 03:17 UTC, off the top of the hour
  workflow_dispatch:
    inputs:
      publish:
        description: 'push commits and open issues (off = dry run, decides only)'
        type: boolean
        default: false

permissions:
  contents: read                  # main-repo checkout only; the recipe repo uses the deploy key
  issues: write                   # failure issues
  actions: write                  # keepalive (re-enable the schedule)

concurrency:
  group: repo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: check out chy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: check out the recipe repo (deploy key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alperien/chy-recipes
          ssh-key: ${{ secrets.RECIPES_DEPLOY_KEY }}
          path: repo

      - name: verify the repo lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p decisions
          if ! sh ci/repo-verify-lock.sh --repo alperien/chy-recipes --decisions decisions; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            find decisions -type f -exec sed -i "s#RUN_URL#$RUN_URL#g" {} +
            sh ci/repo-apply.sh --decisions decisions --repo repo --issue-repo ${{ github.repository }}
            echo "repo lock is loosened; filed an issue and stopped." >&2
            exit 1
          fi

      - name: snapshot Void (pins the day's inputs)
        env:
          GITHUB_TOKEN: ${{ github.token }}   # authed API, for the rate limit (never reaches template evaluation)
        run: python3 translator/chytrans snapshot --out snap $(grep -v '^#' default.set)

      - name: translate and decide (offline, deterministic)
        run: sh ci/repo-sync.sh --snapshot snap --repo repo --set default.set --decisions decisions --translator translator

      - name: cache week (weekly cold starts bound root growth)
        id: week
        run: echo "week=$(date -u +%G%V)" >> "$GITHUB_OUTPUT"

      - name: restore the gate root
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: gate-root
          key: gate-root-${{ hashFiles('chy/chy', 'ci/repo-build.sh') }}-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            gate-root-${{ hashFiles('chy/chy', 'ci/repo-build.sh') }}-${{ steps.week.outputs.week }}-

      - name: build gate (staged recipes, in the Void container)
        run: |
          docker run --rm -v "$PWD:/w" -w /w ghcr.io/void-linux/void-glibc-full:latest sh -c '
            xbps-install -Sy git ca-certificates curl patch gcc make pkg-config xz python3 \
              $(grep -v "^#" tests/acceptance-hostpkgs | tr "\n" " ") \
              || { xbps-install -Syu xbps \
                   && xbps-install -Sy git ca-certificates curl patch gcc make pkg-config xz python3 \
                        $(grep -v "^#" tests/acceptance-hostpkgs | tr "\n" " "); }
            # host stand-ins the staged repo itself names; tolerated here,
            # a genuinely missing tool surfaces as a named build failure
            xbps-install -Sy $(awk "NF {print \$1}" repo/provided.suggested | tr "\n" " ") || true
            git config --global --add safe.directory "*"
            sh ci/repo-build.sh --repo repo --decisions decisions --root /w/gate-root
            rc=$?
            chown -R "$(stat -c %u:%g .)" decisions repo gate-root 2>/dev/null || true
            exit $rc'

      - name: save the gate root (only when the day pushes)
        if: ${{ hashFiles('decisions/commit.msg') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gate-root
          key: gate-root-${{ hashFiles('chy/chy', 'ci/repo-build.sh') }}-${{ steps.week.outputs.week }}-${{ github.run_id }}

      - name: show the decision
        if: always()
        run: ls -R decisions 2>/dev/null; cat decisions/nochange decisions/commit.msg 2>/dev/null || true

      - name: apply (push and issues)
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          find decisions -type f -exec sed -i "s#RUN_URL#$RUN_URL#g" {} +
          sh ci/repo-apply.sh --decisions decisions --repo repo --issue-repo ${{ github.repository }}

      - name: file the crash (the run died before a verdict)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title='repo-sync: run failed before a verdict'
          if ! gh issue list --repo "${{ github.repository }}" --state open \
              --json title --jq '.[].title' | grep -Fqx "$title"; then
            printf 'A sync run died before reaching a verdict (status: %s).\nA timeout here usually means an oversized set chunk.\n\nrun: %s\n' \
              "${{ job.status }}" "$RUN_URL" \
              | gh issue create --repo "${{ github.repository }}" \
                  --title "$title" --body-file -
          fi

      - name: keepalive (reset the 60-day schedule-disable timer)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/repo-sync.yml/enable"
