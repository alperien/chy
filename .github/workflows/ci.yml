# CI: shellcheck + line ceiling on chy, then the test suite on Void.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read                  # checkout only

jobs:
  checks:
    name: shellcheck + line ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck, POSIX mode
        run: shellcheck --shell=sh chy/chy test tests/*.sh ci/corpus-*.sh

      - name: shellcheck, bash mode (the template evaluator)
        run: shellcheck --shell=bash translator/evaluate.sh

      - name: py_compile, translator
        run: python3 -m py_compile translator/*.py

      - name: line ceiling, 2000
        run: |
          max=2000
          lines=$(wc -l < chy/chy)
          echo "chy is $lines lines (ceiling: $max)"
          [ "$lines" -le "$max" ]

  tests:
    name: test suite (Void glibc)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: prepare container
        run: xbps-install -Sy git ca-certificates curl patch gcc make pkg-config xz python3 brotli brotli-devel bash || { xbps-install -Syu xbps && xbps-install -Sy git ca-certificates curl patch gcc make pkg-config xz python3 brotli brotli-devel bash; }

      - uses: actions/checkout@v4

      - name: run the suite
        run: sh ./test

  corpus:
    name: default repo acceptance (gtk+3 -> firefox)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: prepare container
        run: xbps-install -Sy git ca-certificates || { xbps-install -Syu xbps && xbps-install -Sy git ca-certificates; }

      - uses: actions/checkout@v4

      - name: install the host stand-ins (tests/corpus-hostpkgs)
        run: xbps-install -Syu $(grep -v '^#' tests/corpus-hostpkgs | tr '\n' ' ')

      - name: default repo acceptance
        run: CHY_CORPUS=1 sh tests/950-corpus.sh
